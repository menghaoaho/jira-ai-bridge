name: Relay release checks
on:
  push:
    paths: ['relay-manager/**', '.github/workflows/relay-checks.yml']
  pull_request:
    paths: ['relay-manager/**', '.github/workflows/relay-checks.yml']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install cryptography
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Run isolated authorization and proxy tests
        working-directory: relay-manager
        run: python -m unittest discover -s . -p 'test_*.py' -v
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 installer, permissions and config checks
        shell: powershell
        run: .\relay-manager\test_windows.ps1
