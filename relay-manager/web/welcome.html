<!doctype html>
<html lang="zh-CN" data-mode="live"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Jira 连接助手 · 开始使用</title><link rel="stylesheet" href="style.css"><script defer src="ui.js"></script><script defer src="welcome.js"></script></head>
<body class="install-page"><nav class="install-nav"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span>Jira 连接助手</a><span id="welcome-demo" class="demo-label" hidden>交互演示 · 不连接真实服务</span></nav>
<main class="install-layout"><header class="install-title"><h1>打开 Jira，开始工作</h1><p>查看问题、跟进进展，直接从这里进入。</p></header>
<div class="welcome-cards"><section class="panel"><span data-icon="computer" class="welcome-icon"></span><h2>使用 Jira</h2><p>已有 Jira 账号即可登录。电脑、手机都能打开，无需安装连接工具。</p><a id="welcome-jira" class="primary full-width" href="/">打开 Jira<span data-icon="arrow"></span></a></section>
<section class="panel"><span data-icon="home" class="welcome-icon"></span><h2>使用工作台</h2><p>查看汇总看板和问题进展，使用你已有的工作台账号登录。</p><a id="welcome-workbench" class="secondary full-width" href="#">打开工作台<span data-icon="arrow"></span></a></section></div>
<section class="panel invite-entry"><h2>我收到了安装邀请</h2><p>仅需要提供连接的 Windows 公司电脑安装。把管理员发来的完整邀请链接粘贴到这里。</p><form id="open-invitation"><label for="invitation-link">专属邀请链接</label><input id="invitation-link" type="url" required autocomplete="off" spellcheck="false" placeholder="粘贴管理员发来的完整链接"><button class="primary" type="submit">开始一键安装<span data-icon="arrow"></span></button><p id="welcome-error" class="form-error" role="alert" hidden></p></form></section>
<p class="hint welcome-footer">Jira 与工作台账号沿用原有设置。需要账号或安装邀请时，请联系管理员。</p></main></body></html>
